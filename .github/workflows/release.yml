name: Build and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Online settings
        shell: bash
        env:
          HKS_SUPABASE_URL: ${{ secrets.HKS_SUPABASE_URL }}
          HKS_SUPABASE_KEY: ${{ secrets.HKS_SUPABASE_KEY }}
        run: |
          if [ -n "$HKS_SUPABASE_URL" ]; then printf '{"url":"%s","key":"%s"}' "$HKS_SUPABASE_URL" "$HKS_SUPABASE_KEY" > online.json; fi
      - name: Licensed kart model (encrypted in the repo; the key is a repository secret)
        shell: bash
        env:
          HKS_ASSET_KEY: ${{ secrets.HKS_ASSET_KEY }}
        run: |
          if [ -n "$HKS_ASSET_KEY" ]; then
            mkdir -p assets-private
            printf '%s' "$HKS_ASSET_KEY" > "$RUNNER_TEMP/k"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in assets/kart.glb.enc -out assets-private/kart.glb -pass "file:$RUNNER_TEMP/k"
            rm -f "$RUNNER_TEMP/k"
          fi
      - run: npm run build:game
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.exe
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
